[package]
name = "tierlock"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Seal and verify authority-preserving execution itineraries"
license = "MIT"
repository = "https://github.com/nicholas-ruest/tierlock"
keywords = ["edge", "policy", "provenance", "security", "ai"]
categories = ["command-line-utilities", "cryptography"]

[dependencies]
clap = { version = "4.5", features = ["derive"] }
hex = "0.4"
hmac = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"

[profile.release]
lto = "thin"
strip = "symbols"
